[project]
name = "finassist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "langchain>=1.3.14",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "pdfplumber>=0.11.0",
    "pydantic>=2.9.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dashboard = [
    "pandas>=2.2.0",
    "requests>=2.34.2",
    "streamlit>=1.59.2",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]
